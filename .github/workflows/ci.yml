name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i Xcode
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: swift-format
        run: |
          if command -v swift-format >/dev/null 2>&1; then
            find DGXPulse DGXPulseTests -name '*.swift' -print0 | xargs -0 swift-format lint --strict --configuration .swift-format
          else
            find DGXPulse DGXPulseTests -name '*.swift' -print0 | xargs -0 swift format lint --strict --configuration .swift-format
          fi

      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project DGXPulse.xcodeproj \
            -scheme DGXPulse \
            -destination 'platform=macOS' \
            -only-testing:DGXPulseTests \
            CODE_SIGNING_ALLOWED=NO
